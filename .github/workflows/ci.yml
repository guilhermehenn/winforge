name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (o que o WinForge.cmd usa); pwsh = PowerShell 7.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Pester 5
        run: Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Rodar os testes
        run: ./tests/Run-Tests.ps1

  strict:
    name: Testes em modo estrito
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Pester 5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      # Set-StrictMode -Version Latest nos módulos: variáveis não definidas e propriedades inexistentes viram erro.
      - name: Rodar os testes (modo estrito)
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -Strict

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisar os scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
